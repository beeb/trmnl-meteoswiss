---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://app-prod-ws.meteoswiss-app.ch/v2/plzDetail?plz={{ plz }}00
polling_headers: ''
polling_body: ''
id: 62668
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  category: environment,life
  description: Detailed MeteoSwiss forecast charts for a Swiss location. Weather data provided by MeteoSwiss.
  github_url: https://github.com/beeb/trmnl-meteoswiss
  learn_more_url: https://www.meteoswiss.admin.ch/
- keyname: plz
  field_type: number
  name: Postal code
  description: Swiss postal code (PLZ) of the location, e.g. 1003
  default: 1003
  min: 1000
  max: 9999
- keyname: location_name
  field_type: string
  name: Location name
  description: Name shown in the title bar
  default: Lausanne
name: MeteoSwiss Charts
description: MeteoSwiss detailed charts
refresh_interval: 15
